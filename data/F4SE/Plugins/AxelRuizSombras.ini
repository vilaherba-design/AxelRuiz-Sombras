; AxelRuiz-Sombras 0.1.0 - fase 1 (nucleo invisible). No cambia nada en pantalla.
; El log se escribe en Documents\My Games\Fallout4VR\F4SE\AxelRuizSombras.log

[General]
; 0 = el plugin carga y no hace nada
bEnabled=1

[Phase1]
; 1 = el juego recibe nuestra propia copia (identica) de cada shader: demuestra que podemos sustituirlos
bIdenticalCopy=1
; 1 = una linea en el log por cada shader creado (hash, tipo, tamano)
bLogShaders=1
; 1 = registra cada render target que crea el juego (tamano y formato)
bLogRenderTargets=1
; 1 = cuenta cuantos shaders se asignan y cuantos son nuestras copias, y escribe un resumen
bCountBinds=1
; cada cuantos segundos se escribe ese resumen
iSummarySeconds=10
