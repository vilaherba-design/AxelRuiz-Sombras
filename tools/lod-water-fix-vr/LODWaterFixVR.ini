; LOD Water Fix VR 1.0.1
; Esconde el agua lejana (LOD) que Fallout 4 VR dibuja por error encima del agua real.
; Hides the distant (LOD) water that Fallout 4 VR wrongly draws over the real water.

[General]
; 0 = el plugin carga y no hace nada / the plugin loads and does nothing
bEnabled=1
; cada cuantos milisegundos se revisa el agua (5-10000). Con valores altos la lamina puede verse ese tiempo al cargar zonas nuevas.
; how often the water is checked, in milliseconds (5-10000). With high values the sheet can show for that long when new areas load.
iIntervalMs=30
; 1 = escribe Documents\My Games\Fallout4VR\F4SE\LODWaterFixVR.log (como mucho una linea cada 10 s). 0 = sin log.
; 1 = write that log file (at most one line every 10 s). 0 = no log.
bLog=0
